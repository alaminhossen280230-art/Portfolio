<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ALIF. — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css?v=4" />
</head>
<body>

  <main class="viewport">
    <div class="canvas">

      <!-- Upper Hero Cluster -->
      <section class="hero-cluster">
        <!-- Top Status Pill -->
        <div class="status-pill">
          <div class="avatar-ring">
            <img src="./avatar.jpg" alt="Alif" class="avatar-img" onerror="this.style.display='none'" />
            <span class="avatar-fallback">A</span>
          </div>
          <span class="brand-name">ALIF.</span>
          <div class="status-indicator">
            <span class="pulse-dot"></span>
            <span class="status-text">Available for work</span>
          </div>
        </div>

        <!-- Headline + Web Strands Wrapper -->
        <div class="headline-stage" id="headlineStage">
          <h1 class="hero-title" id="heroTitle">
            DESIGN THAT<br>
            MAKES PEOPLE<br>
            LOOK TWICE
          </h1>

          <!-- Dynamic SVG Silk/Cobweb Layer -->
          <svg class="web-overlay" id="webOverlay" aria-hidden="true"></svg>

          <!-- Center CTA -->
          <a href="#resume" class="resume-btn">
            <span>Resume</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"></path>
              <path d="m12 5 7 7-7 7"></path>
            </svg>
          </a>

          <!-- Hanging Role Pills -->
          <div class="roles-field">
            <div class="role-pill pill-uiux" data-anchor-x="0.28" data-anchor-y="0.58" style="--rot: -7.5deg; --delay: 0s;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="6 4 20 12 6 20 6 4"></polygon>
              </svg>
              <span>UI/UX Designer</span>
            </div>

            <div class="role-pill pill-motion" data-anchor-x="0.72" data-anchor-y="0.58" style="--rot: 5.5deg; --delay: -1.4s;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2.5"></rect>
                <path d="M2 9h20"></path>
                <path d="m7 4 3 5"></path>
                <path d="m14 4 3 5"></path>
              </svg>
              <span>Motion Designer</span>
            </div>

            <div class="role-pill pill-video" data-anchor-x="0.38" data-anchor-y="0.58" style="--rot: 4.5deg; --delay: -2.2s;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 21 12 15 6"></polyline>
                <polyline points="9 6 3 12 9 18"></polyline>
              </svg>
              <span>Video Editor</span>
            </div>

            <div class="role-pill pill-web" data-anchor-x="0.64" data-anchor-y="0.58" style="--rot: -5.5deg; --delay: -0.8s;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2.5"></rect>
                <line x1="3" y1="9" x2="21" y2="9"></line>
              </svg>
              <span>Web Developer</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Bottom Glass Dock -->
      <nav class="glass-dock" aria-label="Primary Navigation">
        <a href="#projects" class="dock-item">
          <div class="dock-tile tile-projects">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
          </div>
          <span>Projects</span>
        </a>

        <a href="#contact" class="dock-item">
          <div class="dock-tile tile-contact">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
          </div>
          <span>Contact</span>
        </a>

        <a href="#about" class="dock-item">
          <div class="dock-tile tile-about">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <span>About</span>
        </a>

        <a href="#social" class="dock-item">
          <div class="dock-tile tile-social">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </div>
          <span>Social</span>
        </a>
      </nav>

    </div>
  </main>

  <script>
    function renderSingleSpiderStrings() {
      const stage = document.getElementById('headlineStage');
      const title = document.getElementById('heroTitle');
      const svg = document.getElementById('webOverlay');
      const pills = document.querySelectorAll('.role-pill');

      if (!stage || !title || !svg) return;

      const stageRect = stage.getBoundingClientRect();
      const titleRect = title.getBoundingClientRect();

      svg.setAttribute('viewBox', `0 0 ${stageRect.width} ${stageRect.height}`);

      let html = `
        <defs>
          <filter id="silkCrisp" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1" stdDeviation="1.1" flood-color="#142036" flood-opacity="0.32" />
          </filter>
        </defs>
        <g filter="url(#silkCrisp)">
      `;

      const tLeft = titleRect.left - stageRect.left;
      const tTop = titleRect.top - stageRect.top;
      const tW = titleRect.width;
      const tH = titleRect.height;
      const tBottom = tTop + tH - 6;

      const cornerWebs = [
        { x: tLeft + tW * 0.11, y: tTop + tH * 0.08, r: 26, startDeg: 10, endDeg: 85 },
        { x: tLeft + tW * 0.89, y: tTop + tH * 0.38, r: 24, startDeg: 100, endDeg: 175 },
        { x: tLeft + tW * 0.16, y: tTop + tH * 0.72, r: 28, startDeg: -10, endDeg: 75 },
        { x: tLeft + tW * 0.82, y: tTop + tH * 0.74, r: 25, startDeg: 105, endDeg: 185 }
      ];

      cornerWebs.forEach((cw) => {
        const spokes = 4;
        const spokePts = [];
        for (let s = 0; s < spokes; s++) {
          const deg = cw.startDeg + ((cw.endDeg - cw.startDeg) * s) / (spokes - 1);
          const rad = (deg * Math.PI) / 180;
          const ex = cw.x + Math.cos(rad) * cw.r;
          const ey = cw.y + Math.sin(rad) * cw.r;
          spokePts.push({ x: ex, y: ey });
          html += `<line x1="${cw.x}" y1="${cw.y}" x2="${ex}" y2="${ey}" stroke="rgba(255,255,255,0.52)" stroke-width="0.85" />`;
        }
        [0.42, 0.7, 0.95].forEach((scale) => {
          for (let s = 0; s < spokePts.length - 1; s++) {
            const ax = cw.x + (spokePts[s].x - cw.x) * scale;
            const ay = cw.y + (spokePts[s].y - cw.y) * scale;
            const bx = cw.x + (spokePts[s + 1].x - cw.x) * scale;
            const by = cw.y + (spokePts[s + 1].y - cw.y) * scale;
            const mx = (ax + bx) / 2 - (bx - cw.x) * 0.12;
            const my = (ay + by) / 2 + 2.5;
            html += `<path d="M ${ax} ${ay} Q ${mx} ${my} ${bx} ${by}" stroke="rgba(255,255,255,0.45)" stroke-width="0.75" fill="none" />`;
          }
        });
      });

      function qPt(p0, p1, p2, t) {
        const inv = 1 - t;
        return {
          x: inv * inv * p0.x + 2 * inv * t * p1.x + t * t * p2.x,
          y: inv * inv * p0.y + 2 * inv * t * p1.y + t * t * p2.y
        };
      }

      pills.forEach((pill, idx) => {
        const pillRect = pill.getBoundingClientRect();
        const anchorRatio = parseFloat(pill.dataset.anchorX || '0.5');

        const p0 = {
          x: tLeft + tW * anchorRatio,
          y: tBottom
        };
        const p2 = {
          x: pillRect.left - stageRect.left + pillRect.width * 0.5,
          y: pillRect.top - stageRect.top + 3
        };
        const curveDir = idx % 2 === 0 ? -12 : 12;
        const p1 = {
          x: (p0.x + p2.x) / 2 + curveDir,
          y: (p0.y + p2.y) / 2
        };

        const rootSpread = 14;
        const rootDrop = 16;
        const firstBend = qPt(p0, p1, p2, 0.12);
        html += `<path d="M ${p0.x - rootSpread} ${p0.y - 2} Q ${p0.x - 4} ${p0.y + rootDrop * 0.6} ${firstBend.x} ${firstBend.y}" stroke="rgba(255,255,255,0.65)" stroke-width="0.85" fill="none" />`;
        html += `<path d="M ${p0.x + rootSpread} ${p0.y - 2} Q ${p0.x + 4} ${p0.y + rootDrop * 0.6} ${firstBend.x} ${firstBend.y}" stroke="rgba(255,255,255,0.65)" stroke-width="0.85" fill="none" />`;
        html += `<path d="M ${p0.x - rootSpread * 0.65} ${p0.y + 3} Q ${p0.x} ${p0.y + 8} ${p0.x + rootSpread * 0.65} ${p0.y + 3}" stroke="rgba(255,255,255,0.5)" stroke-width="0.75" fill="none" />`;

        html += `<path d="M ${p0.x} ${p0.y} Q ${p1.x} ${p1.y} ${p2.x} ${p2.y}" stroke="rgba(255,255,255,0.85)" stroke-width="1.35" fill="none" />`;

        const braidCtrl = {
          x: (p0.x + p2.x) / 2 - curveDir * 0.65,
          y: (p0.y + p2.y) / 2
        };
        html += `<path d="M ${p0.x} ${p0.y} Q ${braidCtrl.x} ${braidCtrl.y} ${p2.x} ${p2.y}" stroke="rgba(255,255,255,0.42)" stroke-width="0.75" stroke-dasharray="6 4" fill="none" />`;

        [0.28, 0.52, 0.76].forEach((t, bIdx) => {
          const pt = qPt(p0, p1, p2, t);
          const radius = bIdx === 1 ? 1.8 : 1.3;
          html += `<circle cx="${pt.x}" cy="${pt.y}" r="${radius}" fill="rgba(255,255,255,0.9)" />`;
        });

        html += `<circle cx="${p2.x}" cy="${p2.y}" r="2.4" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.2" />`;
        html += `<circle cx="${p2.x}" cy="${p2.y}" r="1.1" fill="#ffffff" />`;
      });

      html += `</g>`;
      svg.innerHTML = html;
    }

    window.addEventListener('load', renderSingleSpiderStrings);
    window.addEventListener('resize', renderSingleSpiderStrings);
    setInterval(renderSingleSpiderStrings, 50);
  </script>

</body>
</html>
