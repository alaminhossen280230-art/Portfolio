<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ALIF. — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css?v=8" />
</head>
<body>
  <main class="viewport">
    <div class="canvas">
      <section class="hero-cluster">
        <div class="status-pill">
          <div class="avatar-ring">
            <img src="./avatar.jpg" alt="Alif" class="avatar-img" onerror="this.style.display='none'" />
            <span class="avatar-fallback" aria-hidden="true">A</span>
          </div>
          <span class="brand-name">ALIF.</span>
          <span class="status-indicator"><span class="pulse-dot" aria-hidden="true"></span><span class="status-text">Available for work</span></span>
        </div>

        <div class="headline-stage" id="headlineStage">
          <h1 class="hero-title" id="heroTitle">DESIGN THAT<br />MAKES PEOPLE<br />LOOK TWICE</h1>
          <a href="#resume" class="resume-btn">
            <span>Resume</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
          </a>
          <div class="roles-field" aria-label="Areas of work">
            <div class="role-pill pill-uiux"><span aria-hidden="true">✦</span><span>UI/UX Designer</span></div>
            <div class="role-pill pill-motion"><span aria-hidden="true">▣</span><span>Motion Designer</span></div>
            <div class="role-pill pill-video"><span aria-hidden="true">‹/›</span><span>Video Editor</span></div>
            <div class="role-pill pill-web"><span aria-hidden="true">▤</span><span>Web Developer</span></div>
          </div>
        </div>
      </section>

      <nav class="glass-dock" aria-label="Primary Navigation">
        <a href="./projects.html" class="dock-item">
          <span class="dock-tile tile-projects"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg></span>
          <span>Projects</span>
        </a>
        <a href="mailto:hello@example.com" class="dock-item">
          <span class="dock-tile tile-contact"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg></span>
          <span>Contact</span>
        </a>
        <a href="#about" class="dock-item">
          <span class="dock-tile tile-about"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
          <span>About</span>
        </a>
        <a href="#social" class="dock-item">
          <span class="dock-tile tile-social"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg></span>
          <span>Social</span>
        </a>
      </nav>
    </div>
  </main>

  <script>
    (() => {
      const dock = document.querySelector('.glass-dock');
      if (!dock) return;
      let audioContext;
      let lastPointerTime = 0;

      function playDropSound() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          audioContext ||= new AudioContext();
          if (audioContext.state === 'suspended') audioContext.resume();
          const now = audioContext.currentTime;
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(980, now);
          oscillator.frequency.exponentialRampToValueAtTime(430, now + 0.11);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.09, now + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start(now);
          oscillator.stop(now + 0.15);
        } catch (_) { /* Audio is optional; interaction still works if unavailable. */ }
      }

      function animate(item) {
        item.classList.remove('is-pressed');
        void item.offsetWidth;
        item.classList.add('is-pressed');
        window.setTimeout(() => item.classList.remove('is-pressed'), 240);
      }

      dock.addEventListener('pointerdown', (event) => {
        const item = event.target.closest('.dock-item');
        if (!item || (event.pointerType === 'mouse' && event.button !== 0)) return;
        lastPointerTime = Date.now();
        animate(item);
        playDropSound();
      }, { passive: true });

      dock.addEventListener('click', (event) => {
        const item = event.target.closest('.dock-item');
        if (!item) return;
        // Keyboard activation has no pointerdown, so provide the same feedback.
        if (Date.now() - lastPointerTime > 700) {
          animate(item);
          playDropSound();
        }
      });
    })();
  </script>
</body>
</html>
