<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ALIF. — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css?v=14" />
</head>
<body>
  <main class="viewport">
    <div class="canvas">
      <section class="hero-cluster">

        <div class="status-pill">
          <div class="avatar-ring">
            <span class="avatar-fallback" aria-hidden="true">A</span>
            <img src="./avatar.png" alt="Alif" class="avatar-img" onerror="this.style.display='none'" />
          </div>
          <span class="brand-name">ALIF.</span>
          <span class="status-indicator"><span class="pulse-dot" aria-hidden="true"></span><span class="status-text">Available for work</span></span>
        </div>

        <div class="headline-stage" id="headlineStage">
          <h1 class="hero-title" id="heroTitle">DESIGN THAT<br />MAKES PEOPLE<br />LOOK TWICE</h1>

          <div class="roles-field" id="rolesField">
            <a href="#resume" class="resume-btn">
              <span>Resume</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
            </a>

            <!--
              Each tag hangs from the headline on a spider-web thread.
              --x    = where the thread starts (0 = left, 1 = right)
              --len  = how long the thread is
              --lean = which way the thread likes to lean
              --tilt = how crooked the tag likes to hang
              All the silk (web around the letters, funnel, beaded thread, tent over the tag) is drawn by script.js.
            -->
            <div class="roles" aria-label="Areas of work">

              <div class="hanger" style="--x:.30; --len:70px; --lean:-3deg; --tilt:-8deg; z-index:4">
                <div class="swing">
                  <svg class="thread" aria-hidden="true"></svg>
                  <div class="role-tag">
                    <svg class="web web--tag" aria-hidden="true"></svg>
                    <div class="role-pill pill-uiux">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>
                      <span>UI/UX Designer</span>
                    </div>
                  </div>
                </div>
              </div>

              <div class="hanger" style="--x:.41; --len:134px; --lean:6deg; --tilt:4deg; z-index:2">
                <div class="swing">
                  <svg class="thread" aria-hidden="true"></svg>
                  <div class="role-tag">
                    <svg class="web web--tag" aria-hidden="true"></svg>
                    <div class="role-pill pill-video">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/></svg>
                      <span>Video Editor</span>
                    </div>
                  </div>
                </div>
              </div>

              <div class="hanger" style="--x:.58; --len:88px; --lean:-17deg; --tilt:6deg; z-index:3">
                <div class="swing">
                  <svg class="thread" aria-hidden="true"></svg>
                  <div class="role-tag">
                    <svg class="web web--tag" aria-hidden="true"></svg>
                    <div class="role-pill pill-motion">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 11h18M7 7l2-4M13 7l2-4"/></svg>
                      <span>Motion Designer</span>
                    </div>
                  </div>
                </div>
              </div>

              <div class="hanger" style="--x:.68; --len:152px; --lean:-4deg; --tilt:-7deg; z-index:1">
                <div class="swing">
                  <svg class="thread" aria-hidden="true"></svg>
                  <div class="role-tag">
                    <svg class="web web--tag" aria-hidden="true"></svg>
                    <div class="role-pill pill-web">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 21h8"/></svg>
                      <span>Web Developer</span>
                    </div>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </section>

      <nav class="glass-dock" aria-label="Primary Navigation">
        <a href="./projects.html" class="dock-item">
          <span class="dock-tile tile-projects"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg></span>
          <span>Projects</span>
        </a>
        <a href="mailto:hello@example.com" class="dock-item">
          <span class="dock-tile tile-contact"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg></span>
          <span>Contact</span>
        </a>
        <a href="#about" class="dock-item">
          <span class="dock-tile tile-about"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
          <span>About</span>
        </a>
        <a href="#social" class="dock-item">
          <span class="dock-tile tile-social"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg></span>
          <span>Social</span>
        </a>
      </nav>
    </div>
  </main>

  <script src="./script.js?v=14"></script>
</body>
</html>
