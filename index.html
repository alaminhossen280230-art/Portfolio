<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALIF. — Portfolio</title>
  <!-- Google Fonts for clean, bold typography -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome for crisp icons -->
  <link rel="stylesheet" href="https://cloudflare.com">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="hero">
    <!-- Top Availability Badge -->
    <header class="top-badge">
      <!-- Replace avatar.png with your uploaded profile image filename -->
      <img src="avatar.png" alt="ALIF Avatar" class="avatar" onerror="this.src='https://placeholder.com'">
      <span class="brand-name">ALIF.</span>
      <span class="status-dot"></span>
      <span class="status-text">Available for work</span>
    </header>

    <!-- Center Headline + Floating Skill Pills -->
    <section class="center-stage">
      <div class="headline-wrapper">
        <h1 class="headline">DESIGN THAT MAKES<br>PEOPLE LOOK TWICE</h1>

        <!-- Left Floating Pills -->
        <div class="pill pill-green">
          <i class="fa-solid fa-play"></i> UI/UX Designer
        </div>
        <div class="pill pill-purple-left">
          <i class="fa-solid fa-clapperboard"></i> Motion Designer
        </div>

        <!-- Right Floating Pills -->
        <div class="pill pill-blue">
          <i class="fa-solid fa-code"></i> Video Editor
        </div>
        <div class="pill pill-purple-right">
          <i class="fa-solid fa-laptop"></i> Web Developer
        </div>
      </div>

      <!-- Resume CTA Button -->
      <a href="#resume" class="resume-btn">
        Resume <i class="fa-solid fa-arrow-right"></i>
      </a>
    </section>

    <!-- Bottom Interactive Dock -->
    <nav class="bottom-dock">
      <a href="#projects" class="dock-item">
        <div class="dock-icon icon-purple"><i class="fa-solid fa-list-ul"></i></div>
        <span>Projects</span>
      </a>
      <div class="divider"></div>
      <a href="#contact" class="dock-item">
        <div class="dock-icon icon-blue"><i class="fa-solid fa-envelope"></i></div>
        <span>Contact</span>
      </a>
      <div class="divider"></div>
      <a href="#about" class="dock-item">
        <div class="dock-icon icon-pink"><i class="fa-solid fa-user"></i></div>
        <span>About</span>
      </a>
      <div class="divider"></div>
      <a href="#social" class="dock-item">
        <div class="dock-icon icon-teal"><i class="fa-regular fa-image"></i></div>
        <span>Social</span>
      </a>
    </nav>
  </main>

</body>
</html>
